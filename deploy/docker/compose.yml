name: phonendo
services:
  storage:
    build: ../../apps/storage
    ports: ["127.0.0.1:${STORAGE_PORT:-7104}:5000"]
    environment:
      API_TOKEN_STORAGE: demo-storage
    volumes:
      - ./storage.json:/app/storage/config.json:ro
      - storage-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  verifier:
    build: ../../apps/verifier
    ports: ["127.0.0.1:${VERIFIER_PORT:-7103}:5000"]
    environment:
      API_TOKEN_VERIFIER: demo-verifier
      MANAGER_PASSWORD: demo-shared-secret
    volumes:
      - ./verifier.json:/app/verifier/config.json:ro
      - ../../apps/verifier/signing_key.json:/app/verifier/signing_key.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  manager:
    build: ../../apps/manager
    ports: ["127.0.0.1:${MANAGER_PORT:-7102}:3003"]
    environment:
      API_TOKEN_MANAGER: demo-manager
      API_TOKEN_STORAGE: demo-storage
      API_TOKEN_VERIFIER: demo-verifier
      MANAGER_PASSWORD: demo-shared-secret
    volumes:
      - ./manager.json:/app/manager/config.json:ro
    depends_on:
      storage: {condition: service_healthy}
      verifier: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3003/', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  reader:
    build: ../../apps/reader
    ports: ["127.0.0.1:${READER_PORT:-7101}:3002"]
    volumes:
      - ./reader.json:/app/reader/config.json:ro
    depends_on:
      manager: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  storage-data:
