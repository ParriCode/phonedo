<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phonendo · Choose a panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff6a4d'/%3E%3Cpath d='M5 17h6l2-5 4 10 3-7h7' fill='none' stroke='%23ffffff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    body { background: var(--navy-950); color: #fff; min-height: 100vh; display: grid; grid-template-rows: 1fr; }
    .split-home { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
    @media (min-width: 801px) { body { height: 100vh; min-height: 640px; } }
    .half { display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: clamp(32px, 6vw, 80px); text-decoration: none; color: #fff; }
    .half .badge { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; }
    .half h1, .half h2 { transition: transform .2s ease; transform-origin: left center; margin: 0; font-size: clamp(30px, 4vw, 52px); letter-spacing: -1.4px; line-height: 1.05; }
    .half p { margin: 0; max-width: 420px; font-size: 16px; color: rgb(255 255 255 / 70%); }
    .half .go { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }
    .operator { background: radial-gradient(800px 500px at 20% 10%, rgb(39 167 196 / 20%), transparent 60%), linear-gradient(180deg, var(--navy-950), var(--navy-900)); transition: filter .2s; }
    .operator:hover { filter: brightness(1.15); }
    .half:hover h1, .half:hover h2 { transform: scale(1.07); }
    a.use-case:hover { background: rgb(255 255 255 / 4%); }
    .operator .badge { background: var(--gold); color: #fff; }
    .operator .go { color: var(--gold); }
    .use-cases { display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) auto; background: var(--navy-800); border-left: 1px solid rgb(255 255 255 / 10%); }
    .use-case { gap: 12px; padding: clamp(20px, 3vw, 40px) clamp(32px, 6vw, 80px); }
    .use-case + .use-case { border-top: 1px solid rgb(255 255 255 / 10%); }
    .use-case .badge { width: 44px; height: 44px; background: rgb(255 255 255 / 10%); color: var(--mint); }
    .use-case .badge .icon { width: 22px !important; height: 22px !important; }
    .more { padding: 6px 0 10px; text-align: center; font-size: 18px; line-height: 1; letter-spacing: 6px; color: rgb(255 255 255 / 55%); border-top: 1px solid rgb(255 255 255 / 10%); }
    .use-case .tag { display: inline-block; align-self: flex-start; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid rgb(255 255 255 / 25%); color: rgb(255 255 255 / 65%); }
    .use-case .label { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--gold); }
    .use-case h2 { font-size: clamp(22px, 2.6vw, 32px); }
    @media (max-width: 800px) { .split-home { grid-template-columns: 1fr; } .use-cases { border-left: 0; border-top: 1px solid rgb(255 255 255 / 10%); grid-template-rows: auto auto auto; } }
  </style>
</head>
<body>
  <main class="split-home">
    <a class="half operator" href="operator.html" aria-label="Phonendo operator console">
      <span class="badge"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:28px;height:28px"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></span>
      <h1>Phonendo</h1>
      <span class="go">Open <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
    </a>
    <div class="use-cases">
      <a class="half use-case" href="patient.html" aria-label="Cardiac rehabilitation use case">
        <span class="badge"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.6 1-1.1a5.5 5.5 0 0 0 0-7.7z"/></svg></span>
        <span class="label">Use case</span>
        <h2>Cardiac rehabilitation</h2>
        <p>The insurer pays the patient for each completed session, and never sees the heart-rate readings.</p>
      </a>
      <section class="half use-case">
        <span class="badge"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg></span>
        <span class="label">Use case</span>
        <h2>Cold-chain transport</h2>
        <p>Payment is released only if the goods stayed within the agreed temperature range during transport.</p>
        <span class="tag">Interface pending</span>
      </section>
      <div class="more" aria-label="More use cases">···</div>
    </div>
  </main>
</body>
</html>
