; Reader Phonendo para ESP32 (Arduino). El núcleo y el servidor portables se
; enlazan desde apps/reader/cpp; aquí solo vive el adaptador de plataforma.
[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../../cpp/core
    symlink://../../cpp/server
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
; WiFi + HTTPClient + WebServer + mDNS no caben en la partición de 1,3 MB por
; defecto: app de 3 MB, sin OTA.
board_build.partitions = huge_app.csv

; ESP32-WROOM-32 / 32E
[env:esp32dev]
board = esp32dev

; ESP32-S3-WROOM (por si el módulo es un S3)
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
