# Versiones del ejemplo Wear OS. AGP 8.13 necesita Gradle 8.13+ (devenv da
# 8.14) y compileSdk 36; el NDK y CMake los fija app/build.gradle.kts y deben
# coincidir con devenv.nix.
[versions]
agp = "8.13.1"
kotlin = "2.2.21"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
wearCompose = "1.4.1"
healthServices = "1.1.0"
coroutines = "1.10.2"
junit = "4.13.2"
# Health Services devuelve ListenableFuture pero no expone Guava en la API.
guava = "33.4.0-android"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
wear-compose-material = { module = "androidx.wear.compose:compose-material", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
health-services = { module = "androidx.health:health-services-client", version.ref = "healthServices" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
