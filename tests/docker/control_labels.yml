# Etiquetas que el panel exige para actuar sobre un contenedor. Publisher queda
# sin ellas a propósito para comprobar que el panel lo rechaza.
services:
  storage:
    labels: { phonendo.control.managed: "true", phonendo.control.deployment: docker-local }
  verifier:
    labels: { phonendo.control.managed: "true", phonendo.control.deployment: docker-local }
  manager:
    labels: { phonendo.control.managed: "true", phonendo.control.deployment: docker-local }
  reader:
    labels: { phonendo.control.managed: "true", phonendo.control.deployment: docker-local }
