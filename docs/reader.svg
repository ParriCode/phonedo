="entity" data-qualified-name="GMN31" data-source-line="103" id="ent0032"><path d="M252.5,630.0679 L252.5,693.186 A0,0 0 0 0 252.5,693.186 L613.4113,693.186 A0,0 0 0 0 613.4113,693.186 L613.4113,640.0679 L603.4113,630.0679 L486.5138,630.0679 L668.9805,514.1163 L478.5138,630.0679 L252.5,630.0679 A0,0 0 0 0 252.5,630.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M603.4113,630.0679 L603.4113,640.0679 L613.4113,640.0679 L603.4113,630.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.9332" x="258.5" y="648.9649">on_observation puede ser una funci&#243;n del usuario.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.9113" x="258.5" y="666.6709">Si se conecta ReaderService, este gestiona los callbacks.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.4163" x="258.5" y="684.377">Core no serializa ni env&#237;a HTTP por s&#237; mismo.</text></g><g class="entity" data-qualified-name="GMN34" data-source-line="108" id="ent0035"><path d="M248,354.0679 L248,434.892 A0,0 0 0 0 248,434.892 L612.0183,434.892 A0,0 0 0 0 612.0183,434.892 L612.0183,364.0679 L602.0183,354.0679 L393.6837,354.0679 L229.5347,196.5589 L385.6837,354.0679 L248,354.0679 A0,0 0 0 0 248,354.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M602.0183,354.0679 L602.0183,364.0679 L612.0183,364.0679 L602.0183,354.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.1072" x="254" y="372.9649">GET /health, /metadata, /devices</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.0792" x="254" y="390.6709">GET /observations/stream (opcional)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.5993" x="254" y="408.377">No existe ingesti&#243;n HTTP ni historial SSE.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.0183" x="254" y="426.083">enabled refleja el c&#243;digo actual: a&#250;n no se ha eliminado.</text></g><!--class ReaderCore--><g class="entity" data-qualified-name="Core .sin HTTP ni hardware..ReaderCore" data-source-line="8" id="ent0003"><rect fill="#F1F1F1" height="238.6792" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="459.1863" x="630.5" y="275.0679"/><ellipse cx="816.9723" cy="291.0679" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M816.441,297.9898 Q814.691,297.9898 813.5504,297.2554 Q812.4254,296.5054 811.8629,295.1617 Q811.316,293.8023 811.316,292.0054 Q811.316,289.9742 811.9723,288.521 Q812.6285,287.0679 813.9098,286.2867 Q815.191,285.5054 817.066,285.5054 Q817.9567,285.5054 818.6285,285.6929 Q819.3004,285.8648 819.9879,286.2085 L819.1754,288.2242 Q818.5504,287.9117 818.0035,287.7867 Q817.4723,287.6617 816.9879,287.6617 Q815.816,287.6617 815.1129,288.1929 Q814.4098,288.7242 814.1129,289.6773 Q813.816,290.6304 813.816,291.896 Q813.816,293.9117 814.5348,294.8804 Q815.2535,295.8335 816.8473,295.8335 Q817.441,295.8335 818.066,295.6773 Q818.691,295.521 819.5192,295.146 L819.5192,297.3648 Q818.7848,297.6773 817.9879,297.8335 Q817.2067,297.9898 816.441,297.9898 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.7417" x="837.4723" y="296.4999">ReaderCore</text><line style="stroke:#181818;stroke-width:0.5;" x1="631.5" x2="1088.6863" y1="307.0679" y2="307.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.1996" x="636.5" y="326.0339">+reader_id: str</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="213.0511" x