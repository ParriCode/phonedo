00000;stroke-width:1.0;" width="132.0869" x="1417" y="249.1094"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="112.0869" x="1427" y="271.1763">Soroban contract</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="69.1831" x="1427" y="286.3091">adherence</text></g><!--entity T--><g id="elem_T"><rect fill="#E8E6FF" height="35.1328" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="97.8032" x="1814" y="249.6094"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="77.8032" x="1824" y="271.6763">USDC token</text></g><!--entity U--><g id="elem_U"><ellipse cx="2062.6257" cy="238.1094" fill="#FFFFFF" rx="8" ry="8" style="stroke:#000000;stroke-width:1.0;"/><path d="M2062.6257,246.1094 L2062.6257,273.1094 M2049.6257,254.1094 L2075.6257,254.1094 M2062.6257,273.1094 L2049.6257,288.1094 M2062.6257,273.1094 L2075.6257,288.1094 " fill="none" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="101.2515" x="2012" y="302.1763">Patient / carrier</text></g><!--entity W--><g id="elem_W"><rect fill="#FFFFFF" height="50.2656" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="96.0767" x="1815" y="333.1094"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="76.0767" x="1825" y="355.1763">Web panels</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="47.3853" x="1825" y="370.3091">(React)</text></g><g id="elem_GMN24"><path d="M11,57.6094 L11,128.1406 A0,0 0 0 0 11,128.1406 L167,128.1406 L171,221.8394 L175,128.1406 L331.4951,128.1406 A0,0 0 0 0 331.4951,128.1406 L331.4951,67.6094 L321.4951,57.6094 L11,57.6094 A0,0 0 0 0 11,57.6094 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M321.4951,57.6094 L321.4951,67.6094 L331.4951,67.6094 L321.4951,57.6094 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="299.4951" x="17" y="74.6763">Computes the commitment from the readings</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="247.3491" x="17" y="89.8091">it verified itself, never from the caller.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="212.5195" x="17" y="104.9419">Signs commitment || sessionId ||</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="153.0356" x="17" y="120.0747">patient key || verifierId.</text></g><g id="elem_GMN27"><path d="M1343,97.6094 L1343,198.4063 A0,0 0 0 0 1343,198.4063 L1479,198.4063 L1483,249.0094 L1487,198.4063 L1622.7686,198.4063 A0,0 0 0 0 1622.7686,198.4063 L1622.7686,107.6094 L1612.7686,97.6094 L1343,97.6094 A0,0 0 0 0 1343,97.6094 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M1612.7686,97.6094 L1612.7686,107.6094 L1622.7686,107.6094 L1612.7686,97.6094 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="258.7686" x="1349" y="114.6763">claim() checks: session not paid before,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="221.2412" x="1349" y="129.8091">Verifier signature (host ed25519),</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="253.7031" x="1349" y="144.9419">Groth16 proof (BLS12-381) against the</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="223.6724" x="1349" y="160.0747">policy stored on-chain. Then pays.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="175.8618" x="1349" y="175.2075">One contract per use case:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="189.7568" x="1349" y="190.3403">rehabilitation and cold chain.</text></g><!--link R to M--><g id="link_R_M"><path d="M262.66,460.4194 C347.45,472.6094 474.66,477.8494 568,424.1094 C601.62,404.7494 619.1992,366.7788 627.9592,342.2888 " fill="none" id="R-to-M" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="629.98,336.6394,623.1825,343.7664,628.296,341.3473,630.7151,346.4608,629.98,336.6394" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="118.4092" x="405.5068" y="390.1763">readings over SSE</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="140.4229" x="394.5" y="405.3091">(Manager subscribes)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="123.5508" x="402.936" y="420.4419">or HTTP /newEvent</text></g><!--link M to V--><g id="link_M_V"><path d="M597.62,315.5694 C544.54,310.3794 445.09,299.8194 361,286.1094 C316.36,278.8294 272.0991,269.6818 234.6991,261.4318 " fill="none" id="M-to-V" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="228.84,260.1394,236.7671,265.9842,233.7226,261.2164,238.4904,258.172,228.84,260.1394" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="78.9268" x="425.4165" y="267.1763">HTTP /verify</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="151.7598" x="389" y="282.3091">Captured event + hash</text></g><!--link V to M--><g id="link_V_M"><path d="M204.93,272.2994 C240.97,298.1594 301.59,336.7194 361,352.1094 C450.06,375.1894 478.37,372.8494 568,352.1094 C581.47,348.9894 590.0615,345.6146 601.7115,339.4246 " fill="none" id="V-to-M" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="607.01,336.6094,597.1854,337.2999,602.5946,338.9554,600.9391,344.3646,607.01,336.6094" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="91.4443" x="419.0659" y="333.1763">Verified event</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="136.5762" x="396.5" y="348.3091">signed with ed25519</text></g><!--link M to V--><g id="link_M_V"><path d="M624.33,301.3894 C612.62,284.6294 592.52,260.5294 568,250.1094 C455.38,202.2294 313.8163,218.3684 234.4163,233.3284 " fill="none" id="M-to-V-1" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="228.52,234.4394,238.105,236.7038,233.4335,233.5136,236.6238,228.8421,228.52,234.4394" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="107.0215" x="411.1023" y="200.1763">POST /signBatch</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="205.2261" x="362" y="215.3091">reply: commitment + signature</text></g><!--link M to S--><g id="link_M_S"><path d="M652.71,336.7594 C665.25,349.9494 684.29,367.0194 705,375.1094 C795.03,410.2594 905.2581,404.474 965.9681,397.604 " fill="none" id="M-to-S" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="971.93,396.9294,962.5373,393.9667,966.9617,397.4916,963.4368,401.916,971.93,396.9294" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="135.5161" x="744.5" y="356.1763">store Verified events</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="89.9209" x="767.2976" y="371.3091">(HTTP or SSE)</text></g><!--link M to P--><g id="link_M_P"><path d="M675.04,325.2494 C729.62,332.8994 833.7,342.6294 919,322.1094 C938.06,317.5194 952.3698,31