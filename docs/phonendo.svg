dana" font-size="13" lengthAdjust="spacing" textLength="47.684" x="1117.5" y="409.8911">Storage</text></g><!--entity P--><g class="entity" data-qualified-name="P" data-source-line="12" id="ent0006"><rect fill="#FFF2CC" height="55.412" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="89.9011" x="1096.5" y="531.4941"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="57.5641" x="1106.5" y="555.3911">Publisher</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="69.9011" x="1106.5" y="573.0971">(pendiente)</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="25" id="ent0017"><path d="M11,381.4941 L11,462.3182 A0,0 0 0 0 11,462.3182 L285.1883,462.3182 A0,0 0 0 0 285.1883,462.3182 L285.1883,391.4941 L275.1883,381.4941 L152,381.4941 L148,346.0441 L144,381.4941 L11,381.4941 A0,0 0 0 0 11,381.4941" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M275.1883,381.4941 L275.1883,391.4941 L285.1883,391.4941 L275.1883,381.4941" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="182.5202" x="17" y="400.3911">Si un readerId usa /newEvent,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="206.7392" x="17" y="418.0971">HTTP tiene prioridad sobre su SSE</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="162.6561" x="17" y="435.8031">hasta reiniciar el Manager.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="253.1883" x="17" y="453.5092">Reader dispone de output HTTP opcional.</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="32" id="ent0020"><path d="M988,246.4941 L988,345.0242 A0,0 0 0 0 988,345.0242 L1294.8183,345.0242 A0,0 0 0 0 1294.8183,345.0242 L1294.8183,256.4941 L1284.8183,246.4941 L1145.5,246.4941 L1141.5,211.1341 L1137.5,246.4941 L988,246.4941 A0,0 0 0 0 988,246.4941" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1284.8183,246.4941 L1284.8183,256.4941 L1294.8183,256.4941 L1284.8183,246.4941" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="204.0222" x="994" y="265.3911">Puede consumir varios Managers</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="266.0842" x="994" y="283.0971">y distribuir resultados a varios suscriptores.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="245.5702" x="994" y="300.8031">Cada servicio expone su propio /stream.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="285.8183" x="994" y="318.5092">subscriptions configura qu&#233; streams consume.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="282.7112" x="994" y="336.2152">outputStreams configura salidas del Manager.</text></g><!--link R to M--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="14" id="lnk7"><path d="M179.74,327.0641 C262.8,327.2441 485.46,327.7214 574.93,327.9114" fill="none" id="R-to-M" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="580.93,327.9241,571.9385,323.905,575.93,327.9135,571.9215,331.905,580.93,327.9241" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="139.5161" x="363.7165" y="304.8911">Observaciones por SSE</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="234.9492" x="316" y="322.5971">Manager se suscribe a Reader /stream</text></g><!--link R to M--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="15" id="lnk8"><path d="M179.57,334.2541 C247.17,349.1641 414.21,379.7841 551,353.9941 C560.99,352.1141 565.802,350.9335 575.342,347.2535" fill="none" id="R-to-M-1" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="580.94,345.0941,571.1035,344.6012,576.275,346.8936,573.9827,352.0651,580.94,345.0941" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="172.8352" x="347" y="349.8911">Alternativa HTTP: /newEvent</text></g><!--link M to V--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="16" id="lnk9"><path d="M656.16,315.8241 C665.79,312.9441 676.22,310.1041 686,307.9941 C805.22,282.3541 853.83,335.3841 958,271.9941 C977.91,259.8841 968.77,242.1541 988,228.9941 C1024.66,203.9341 1070.4789,196.26 1103.2789,193.65" fill="none" id="M-to-V" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="1109.26,193.1741,1099.9711,189.9006,1104.2758,193.5707,1100.6056,197.8754,1109.26,193.1741" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="241.4492" x="701.5" y="249.8911">HTTP /verify: evento Captured con hash</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="231.8422" x="706.3035" y="267.5971">Respuesta: Verified firmado o rechazo</text></g><!--link M to V--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="17" id="lnk10"><path d="M620.2,308.8741 C622.72,271.5741 634.19,189.6641 686,153.9941 C819.71,61.9641 1025.2478,139.2334 1104.0178,174.6534" fill="none" id="M-to-V-1" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="1109.49,177.1141,1102.9221,169.775,1104.9298,175.0636,1099.6412,177.0713,1109.49,177.1141" style="stroke:#000000;strok