="13" lengthAdjust="spacing" textLength="47.684" x="1153.5" y="399.9611">Storage</text></g><!--entity P--><g class="entity" data-entity="P" data-source-line="12" data-uid="ent0006" id="entity_P"><rect fill="#FFF2CC" height="55.412" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="89.9011" x="1132.5" y="467.5641"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="57.5641" x="1142.5" y="491.4611">Publisher</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="69.9011" x="1142.5" y="509.1671">(pendiente)</text></g><g class="entity" data-entity="GMN15" data-source-line="24" data-uid="ent0016" id="entity_GMN15"><path d="M11,356.5641 L11,437.3882 A0,0 0 0 0 11,437.3882 L284.8113,437.3882 A0,0 0 0 0 284.8113,437.3882 L284.8113,366.5641 L274.8113,356.5641 L152,356.5641 L148,321.1141 L144,356.5641 L11,356.5641 A0,0 0 0 0 11,356.5641" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M274.8113,356.5641 L274.8113,366.5641 L284.8113,366.5641 L274.8113,356.5641" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="182.5202" x="17" y="375.4611">Si un readerId usa /newEvent,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="206.7392" x="17" y="393.1671">HTTP tiene prioridad sobre su SSE</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="162.6561" x="17" y="410.8731">hasta reiniciar el Manager.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="252.8113" x="17" y="428.5792">El Reader base no incluye el output HTTP.</text></g><g class="entity" data-entity="GMN18" data-source-line="31" data-uid="ent0019" id="entity_GMN18"><path d="M1034,241.5641 L1034,322.3882 A0,0 0 0 0 1034,322.3882 L1321.0842,322.3882 A0,0 0 0 0 1321.0842,322.3882 L1321.0842,251.5641 L1311.0842,241.5641 L1181.5,241.5641 L1177.5,206.1141 L1173.5,241.5641 L1034,241.5641 A0,0 0 0 0 1034,241.5641" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1311.0842,241.5641 L1311.0842,251.5641 L1321.0842,251.5641 L1311.0842,241.5641" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="204.0222" x="1040" y="260.4611">Puede consumir varios Managers</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="266.0842" x="1040" y="278.1671">y distribuir resultados a varios suscriptores.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="222.8332" x="1040" y="295.8731">Sus resultados SSE a&#250;n no reanudan</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="168.6881" x="1040" y="313.5792">el guardado en el Manager.</text></g><!--link R to M--><g class="link" data-entity-1="R" data-entity-2="M" data-source-line="14" data-uid="lnk7" id="link_R_M"><path d="M179.58,302.1241 C268.86,302.2941 522.92,302.7923 619.67,302.9823" fill="none" id="R-to-M" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="625.67,302.9941,616.6779,298.9764,620.67,302.9843,616.6622,306.9764,625.67,302.9941" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="139.5161" x="386.2165" y="279.9611">Observaciones por SSE</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="234.9492" x="338.5" y="297.6671">Manager se suscribe a Reader /stream</text></g><!--link R to M--><g class="link" data-entity-1="R" data-entity-2="M" data-source-line="15" data-uid="lnk8" id="link_R_M"><path d="M179.83,310.4741 C227.36,323.4341 313.29,346.8341 315,347.0641 C438.8,363.5441 476.41,383.0441 596,347.0641 C612.4