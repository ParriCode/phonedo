<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="758px" preserveAspectRatio="none" style="width:1346px;height:758px;background:#FFFFFF;" version="1.1" viewBox="0 0 1346 758" width="1346px" zoomAndPan="magnify"><title>Phonendo &#8212; relaciones entre servicios</title><defs/><g><text fill="#000000" font-family="Verdana" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="424.9534" x="456.4324" y="38.5181">Phonendo &#8212; relaciones entre servicios</text><!--entity R--><g class="entity" data-entity="R" data-source-line="8" data-uid="ent0002" id="entity_R"><rect fill="#FFFFFF" height="37.706" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="63.407" x="116.5" y="328.1041"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="43.407" x="126.5" y="352.0011">Reader</text></g><!--entity M--><g class="entity" data-entity="M" data-source-line="9" data-uid="ent0003" id="entity_M"><rect fill="#FFFFFF" height="37.706" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="75.107" x="626" y="329.1041"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="55.107" x="636" y="353.0011">Manager</text></g><!--entity V--><g class="entity" data-entity="V" data-source-line="10" data-uid="ent0004" id="entity_V"><rect fill="#FFFFFF" height="37.706" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="64.382" x="1154.5" y="175.1041"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="44.382" x="1164.5" y="199.0011">Verifier</text></g><!--entity S--><g class="entity" data-entity="S" data-source-line="11" data-uid="ent0005" id="entity_S"><rect fill="#FFFFFF" height="37.706" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="67.684" x="1152.5" y="406.1041"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="47.684" x="1162.5" y="430.0011">Storage</text></g><!--entity P--><g class="entity" data-entity="P" data-source-line="12" data-uid="ent0006" id="entity_P"><rect fill="#FFF2CC" height="55.412" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="89.9011" x="1141.5" y="551.6041"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="57.5641" x="1151.5" y="575.5011">Publisher</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="69.9011" x="1151.5" y="593.2071">(pendiente)</text></g><g class="entity" data-entity="GMN16" data-source-line="25" data-uid="ent0017" id="entity_GMN16"><path d="M11,401.6041 L11,482.4282 A0,0 0 0 0 11,482.4282 L285.1883,482.4282 A0,0 0 0 0 285.1883,482.4282 L285.1883,411.6041 L275.1883,401.6041 L152,401.6041 L148,366.1541 L144,401.6041 L11,401.6041 A0,0 0 0 0 11,401.6041" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M275.1883,401.6041 L275.1883,411.6041 L285.1883,411.6041 L275.1883,401.6041" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="182.5202" x="17" y="420.5011">Si un readerId usa /newEvent,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="206.7392" x="17" y="438.2071">HTTP tiene prioridad sobre su SSE</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="162.6561" x="17" y="455.9131">hasta reiniciar el Manager.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="253.1883" x="17" y="473.6192">Reader dispone de output HTTP opcional.</text></g><g class="entity" data-entity="GMN19" data-source-line="32" data-uid="ent0020" id="entity_GMN19"><path d="M1033,248.6041 L1033,347.1342 A0,0 0 0 0 1033,347.1342 L1339.8183,347.1342 A0,0 0 0 0 1339.8183,347.1342 L1339.8183,258.6041 L1329.8183,248.6041 L1190.5,248.6041 L1186.5,213.2441 L1182.5,248.6041 L1033,248.6041 A0,0 0 0 0 1033,248.6041" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1329.8183,248.6041 L1329.8183,258.6041 L1339.8183,258.6041 L1329.8183,248.6041" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="204.0222" x="1039" y="267.5011">Puede consumir varios Managers</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="266.0842" x="1039" y="285.2071">y distribuir resultados a varios suscriptores.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="245.5702" x="1039" y="302.9131">Cada servicio expone su propio /stream.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="285.8183" x="1039" y="320.6192">subscriptions configura qu&#233; streams consume.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="282.7112" x="1039" y="338.3252">outputStreams configura salidas del Manager.</text></g><!--link R to M--><g class="link" data-entity-1="R" data-entity-2="M" data-source-line="14" data-uid="lnk7" id="link_R_M"><path d="M179.58,347.1641 C268.86,347.3441 522.92,347.8323 619.67,348.0223" fill="none" id="R-to-M" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="625.67,348.0341,616.6779,344.0164,620.67,348.0243,616.6622,352.0164,625.67,348.0341" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="139.5161" x="386.2165" y="325.0011">Observaciones por SSE</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="234.9492" x="338.5" y="342.7071">Manager se suscribe a Reader /stream</text></g><!--link R to M--><g class="link" data-entity-1="R" data-entity-2="M" data-source-line="15" data-uid="lnk8" id="link_R_M"><path d="M179.72,353.6341 C212.9,360.3141 267.42,370.2641 315,374.1041 C439.48,384.1641 473.27,397.2441 596,374.1041 C605.99,372.2241 610.802,371.0435 620.342,367.3635" fill="none" id="R-to-M-1" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="625.94,365.2041,616.1035,364.7112,621.275,367.0036,618.9827,372.1751,625.94,365.2041" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="279.0842" x="316" y="370.0011">Alternativa HTTP: /registerDevice y /newEvent</text></g><!--link M to V--><g class="link" data-entity-1="M" data-entity-2="V" data-source-line="16" data-uid="lnk9" id="link_M_V"><path d="M692.16,329.0941 C703.69,322.0441 717.52,314.6541 731,310.1041 C846.55,271.1241 898.83,337.4941 1003,274.1041 C1022.91,261.9941 1013.77,244.2641 1033,231.1041 C1069.66,206.0441 1115.4789,198.37 1148.2789,195.76" fill="none" id="M-to-V" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="1154.26,195.2841,1144.9711,192.0106,1149.2758,195.6807,1145.6056,199.9854,1154.26,195.2841" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="241.4492" x="746.5" y="252.0011">HTTP /verify: evento Captured con hash</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="231.8422" x="751.3035" y="269.7071">Respuesta: Verified firmado o rechazo</text></g><!--link M to V--><g class="link" data-entity-1="M" data-entity-2="V" data-source-line="17" data-uid="lnk10" id="link_M_V"><path d="M664.44,328.9441 C665.48,288.8541 674.24,196.5141 731,156.1041 C863.23,61.9641 1069.6783,140.4802 1148.8583,176.4902" fill="none" id="M-to-V-1" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="1154.32,178.9741,1147.7834,171.6071,1149.7686,176.9042,1144.4715,178.8894,1154.32,178.9741" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="201.3571" x="766.5" y="91.0011">SSE /stream/verifier del Manager</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="178.6591" x="777.849" y="108.7071">Verifier se suscribe (opcional)</text></g><!--link V to M--><g class="link" data-entity-1="V" data-entity-2="M" data-source-line="18" data-uid="lnk11" id="link_V_M"><path d="M1154.35,195.1241 C1057.6,198.5141 766.59,210.4941 731,233.1041 C696.35,255.1241 679.4944,296.3863 671.3644,322.9763" fill="none" id="V-to-M" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="669.61,328.7141,676.0667,321.277,671.072,323.9326,668.4163,318.9378,669.61,328.7141" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="142.6101" x="795.9081" y="180.0011">SSE /stream del Verifier</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="270.4262" x="732" y="197.7071">Manager se suscribe y contin&#250;a el guardado</text></g><!--link M to S--><g class="link" data-entity-1="M" data-entity-2="S" data-source-line="19" data-uid="lnk12" id="link_M_S"><path d="M701.22,351.2441 C763.51,356.7941 893.79,369.4841 1003,387.1041 C1055.56,395.5941 1110.0833,407.5164 1146.5233,415.9164" fill="none" id="M-to-S" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="1152.37,417.2641,1144.4985,411.3447,1147.4978,416.141,1142.7015,419.1403,1152.37,417.2641" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="237.4582" x="748.5" y="332.0011">HTTP: registrar y consultar dispositivos</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="227.0842" x="753.687" y="349.7071">guardar &#250;nicamente eventos Verified</text></g><!--link M to S--><g class="link" data-entity-1="M" data-entity-2="S" data-source-line="20" data-uid="lnk13" id="link_M_S"><path d="M673.26,367.3341 C683.73,387.7141 703.37,418.7441 731,432.1041 C805.15,467.9741 1054.6249,441.4268 1146.3849,430.1368" fill="none" id="M-to-S-1" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="1152.34,429.4041,1142.9189,426.5331,1147.3774,430.0147,1143.8958,434.4732,1152.34,429.4041" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="204.9452" x="765" y="410.0011">SSE /stream/storage del Manager</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="181.9612" x="776.492" y="427.7071">Storage se suscribe (opcional)</text></g><!--link S to M--><g class="link" data-entity-1="S" data-entity-2="M" data-source-line="21" data-uid="lnk14" id="link_S_M"><path d="M1152.35,444.1841 C1072.7,487.2541 867.08,581.6641 731,494.1041 C686.85,465.7041 672.5565,405.9067 667.6165,373.2167" fill="none" id="S-to-M" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="666.72,367.2841,664.1097,376.7807,667.4671,372.228,672.0199,375.5854,666.72,367.2841" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="142.5581" x="795.7475" y="472.0011">SSE /stream de Storage</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="222.0532" x="756" y="489.7071">Confirmaci&#243;n despu&#233;s del guardado</text></g><!--link M to P--><g class="link" data-entity-1="M" data-entity-2="P" data-source-line="22" data-uid="lnk15" id="link_M_P"><path d="M667.22,367.3341 C674.71,417.2041 697.33,548.6241 731,574.1041 C853.7,666.9641 1047.4445,623.0258 1135.5445,595.9658" fill="none" id="M-to-P" style="stroke:#000000;stroke-width:1;stroke-dasharray:7.0,7.0;"/><polygon fill="#