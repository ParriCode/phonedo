="stroke:#FFFFFF;stroke-width:1;" width="826.4806" x="5" y="700.213"/><line style="stroke:#000000;stroke-width:0.5;" x1="5" x2="831.4806" y1="700.213" y2="700.213"/><line style="stroke:#000000;stroke-width:0.5;" x1="5" x2="831.4806" y1="703.213" y2="703.213"/><rect fill="#FFFFFF" height="25.706" style="stroke:#000000;stroke-width:1;" width="260.0512" x="288.2147" y="688.36"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="242.6712" x="294.2147" y="706.257">Intercambio SSE opcional con Verifier</text><g class="message" data-participant-1="V" data-participant-2="M"><polygon fill="#000000" points="300.969,743.772,290.969,747.772,300.969,751.772,296.969,747.772" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="294.969" x2="569.9532" y1="747.772" y2="747.772"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="176.6181" x="342.152" y="741.963">Suscribirse a /stream/verifier</text></g><g class="message" data-participant-1="M" data-participant-2="V"><polygon fill="#000000" points="558.9532,775.478,568.9532,779.478,558.9532,783.478,562.9532,779.478" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="289.969" x2="564.9532" y1="779.478" y2="779.478"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="134.7451" x="363.0885" y="773.669">Evento Captured (SSE)</text></g><path d="M470,792.478 L470,819.478 L670,819.478 L670,802.478 L660,792.478 L470,792.478" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M660,792.478 L660,802.478 L670,802.478 L660,792.478" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="179.5951" x="476" y="811.375">Verificar y firmar si se acepta.</text><g class="message" data-participant-1="V" data-participant-2="M"><polygon fill="#000000" points="300.969,844.8901,290.969,848.8901,300.969,852.8901,296.969,848.8901" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="294.969" x2="569.9532" y1="848.8901" y2="848.8901"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="256.9842" x="301.969" y="843.0811">Resultado Verified por /stream del Verifier</text></g><path d="M196,861.8901 L196,924.8901 L664,924.8901 L664,871.8901 L654,861.8901 L196,861.8901" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M654,861.8901 L654,871.8901 L664,871.8901 L654,861.8901" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="276.5103" x="202" y="880.7871">El Verifier ya publica para varios suscriptores.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="445.8092" x="202" y="898.4931">Manager correlaciona el resultado con su evento y contin&#250;a el guardado.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="447.0444" x="202" y="916.1991">El env&#237;o SSE no espera respuestas ni reintenta por timeout del suscriptor.</text><g class="message" data-participant-1="M" data-participant-2="S"><polygon fill="#000000" points="652.527,949.7141,662.527,953.7141,652.527,957.7141,656.527,953.7141" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="289.969" x2="658.527" y1="953.7141" y2="953.7141"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="322.2573" x="316.1194" y="947.9051">Guardar Verified (HTTP o salida SSE /stream/storage)</text></g><g class="message" data-participant-1="S" data-participant-2="M"><polygon fill="#000000" points="300.969,981.4201,290.969,985.4201,300.969,989.4201,296.969,985.4201" style=