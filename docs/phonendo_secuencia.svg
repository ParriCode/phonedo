<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1122px" preserveAspectRatio="none" style="width:1927px;height:1122px;background:#FFFFFF;" version="1.1" viewBox="0 0 1927 1122" width="1927px" zoomAndPan="magnify"><title>Phonendo &#8212; from reading to payment</title><defs/><g><text fill="#000000" font-family="Verdana" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="472.667" x="725.6931" y="35.4209">Phonendo &#8212; from reading to payment</text><rect fill="#FFFFFF" height="233.5391" style="stroke:#000000;stroke-width:1.0;" width="564.4565" x="287.334" y="300.7031"/><rect fill="#FFFFFF" height="79.0703" style="stroke:none;stroke-width:1.0;" width="564.4565" x="287.334" y="405.2344"/><rect fill="#FFFFFF" height="49.9375" style="stroke:none;stroke-width:1.0;" width="564.4565" x="287.334" y="484.3047"/><line style="stroke:#000000;stroke-width:1.0;" x1="187" x2="187" y1="82.9063" y2="1115.0313"/><line style="stroke:#000000;stroke-width:1.0;" x1="344.334" x2="344.334" y1="82.9063" y2="1115.0313"/><line style="stroke:#000000;stroke-width:1.0;" x1="591.4731" x2="591.4731" y1="82.9063" y2="1115.0313"/><line style="stroke:#000000;stroke-width:1.0;" x1="688.4966" x2="688.4966" y1="82.9063" y2="1115.0313"/><line style="stroke:#000000;stroke-width:1.0;" x1="792.2729" x2="792.2729" y1="82.9063" y2="1115.0313"/><line style="stroke:#000000;stroke-width:1.0;" x1="1179.5869" x2="1179.5869" y1="82.9063" y2="1115.0313"/><line style="stroke:#000000;stroke-width:1.0;" x1="1546.8335" x2="1546.8335" y1="82.9063" y2="1115.0313"/><rect fill="#FFFFFF" height="30.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="64.1758" x="155" y="51.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="50.1758" x="162" y="71.6045">Reader</text><rect fill="#FFFFFF" height="30.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="75.3662" x="307.334" y="51.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="61.3662" x="314.334" y="71.6045">Manager</text><rect fill="#FFFFFF" height="30.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="65.0234" x="559.4731" y="51.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="51.0234" x="566.4731" y="71.6045">Verifier</text><rect fill="#FFFFFF" height="30.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="68.7764" x="654.4966" y="51.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="54.7764" x="661.4966" y="71.6045">Storage</text><rect fill="#FFFFFF" height="30.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="78.5176" x="753.2729" y="51.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="64.5176" x="760.2729" y="71.6045">Publisher</text><rect fill="#E8E6FF" height="30.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="134.709" x="1112.5869" y="51.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="120.709" x="1119.5869" y="71.6045">Soroban contract</text><rect fill="#FFFFFF" height="30.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="95.9287" x="1499.8335" y="51.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="81.9287" x="1506.8335" y="71.6045">Web panels</text><rect fill="#FFFFFF" height="3" style="stroke:#FFFFFF;stroke-width:1.0;" width="1915.0532" x="5" y="113.4727"/><line style="stroke:#000000;stroke-width:0.5;" x1="5" x2="1920.0532" y1="113.4727" y2="113.4727"/><line style="stroke:#000000;stroke-width:0.5;" x1="5" x2="1920.0532" y1="116.4727" y2="116.4727"/><rect fill="#FFFFFF" height="23.1328" style="stroke:#000000;stroke-width:1.0;" width="221.9683" x="851.5425" y="102.9063"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="203.4424" x="857.5425" y="118.9731">Verification (every reading)</text><polygon fill="#000000" points="198.0879,153.1719,188.0879,157.1719,198.0879,161.1719,194.0879,157.1719" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="192.0879" x2="344.0171" y1="157.1719" y2="157.1719"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="133.9292" x="199.0879" y="152.106">subscribe to /stream</text><polygon fill="#000000" points="333.0171,182.3047,343.0171,186.3047,333.0171,190.3047,337.0171,186.3047" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="187.0879" x2="339.0171" y1="186.3047" y2="186.3047"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="115.8765" x="208.1143" y="181.2388">observation (SSE)</text><path d="M10,199.3047 L10,224.3047 L522,224.3047 L522,209.3047 L512,199.3047 L10,199.3047 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M512,199.3047 L512,209.3047 L522,209.3047 L512,199.3047 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="491.7656" x="16" y="216.3716">Alternative: POST /newEvent; the first transport chosen for a readerId wins.</text><path d="M181,234.4375 L181,259.4375 L507,259.4375 L507,244.4375 L497,234.4375 L181,234.4375 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M497,234.4375 L497,244.4375 L507,244.4375 L497,234.4375 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="305.208" x="187" y="251.5044">Build the Captured event and hash its content.</text><polygon fill="#000000" points="579.9849,281.7031,589.9849,285.7031,579.9849,289.7031,583.9849,285.7031" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="345.0171" x2="585.9849" y1="285.7031" y2="285.7031"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="171.2788" x="382.8616" y="280.6372">verify event (HTTP /verify)</text><path d="M287.334,300.7031 L351.7769,300.7031 L351.7769,307.8359 L341.7769,317.8359 L287.334,317.8359 L287.334,300.7031 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><rect fill="none" height="233.5391" style="stroke:#000000;stroke-width:1.0;" width="564.4565" x="287.334" y="300.7031"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="19.4429" x="302.334" y="313.77">alt</text><text fill="#000000" font-family="Verdana" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="67.5361" x="366.7769" y="312.9136">[Accepted]</text><polygon fill="#000000" points="356.0171,334.9688,346.0171,338.9688,356.0171,342.9688,352.0171,338.9688" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="350.0171" x2="590.9849" y1="338.9688" y2="338.9688"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="222.9678" x="357.0171" y="333.9028">Verified event, ed25519 signature</text><polygon fill="#000000" points="676.8848,364.1016,686.8848,368.1016,676.8848,372.1016,680.8848,368.1016" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="345.0171" x2="682.8848" y1="368.1016" y2="368.1016"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="128.7432" x="452.5793" y="363.0356">store Verified event</text><polygon fill="#000000" points="780.5317,393.2344,790.5317,397.2344,780.5317,401.2344,784.5317,397.2344" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="345.0171" x2="786.5317" y1="397.2344" y2="397.2344"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="184.793" x="476.3779" y="392.1685">Verified event (SSE /stream)</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="287.334" x2="851.7905" y1="406.2344" y2="406.2344"/><text fill="#000000" font-family="Verdana" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="114.5117" x="292.334" y="416.4448">[Explicit rejection]</text><polygon fill="#000000" points="356.0171,437.1719,346.0171,441.1719,356.0171,445.1719,352.0171,441.1719" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="350.0171" x2="590.9849" y1="441.1719" y2="441.1719"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="57.002" x="440" y="436.106">rejection</text><path d="M301,454.1719 L301,479.1719 L731,479.1719 L731,464.1719 L721,454.1719 L301,454.1719 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M721,454.1719 L721,464.1719 L731,464.1719 L721,454.1719 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="144.5742" x="439.6824" y="471.2388">Discard; never stored.</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="287.334" x2="851.7905" y1="485.3047" y2="485.3047"/><text fill="#000000" font-family="Verdana" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="60.8975" x="292.334" y="495.5151">[Timeout]</text><path d="M301,504.1094 L301,529.1094 L731,529.1094 L731,514.1094 L721,504.1094 L301,504.1094 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M721,504.1094 L721,514.1094 L731,514.1094 L721,504.1094 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="317.3955" x="353.2717" y="521.1763">In-memory queue; retry from the pending stage.</text><rect fill="#FFFFFF" height="3" style="stroke:#FFFFFF;stroke-width:1.0;" width="1915.0532" x="5" y="561.8086"/><line style="stroke:#000000;stroke-width:0.5;" x1="5" x2="1920.0532" y1="561.8086" y2="561.8086"/><line style="stroke:#000000;stroke-width:0.5;" x1="5" x2="1920.0532" y1="564.8086" y2="564.8086"/><rect fill="#FFFFFF" height="23.1328" style="stroke:#000000;stroke-width:1.0;" width="401.0547" x="761.9993" y="551.2422"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="382.5288" x="767.9993" y="567.3091">Proof and payment (every 5 readings of one device)</text><path d="M506,589.375 L506,644.375 L1078,644.375 L1078,599.375 L1068,589.375 L506,589.375 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M1068,589.375 L1068,599.375 L1078,599.375 L1068,589.375 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="551.5796" x="512" y="606.4419">Collect 5 Verified readings, derive sessionId from their event ids, pick a random salt.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="371.814" x="512" y="621.5747">Generate the Groth16 proof (circuits/): at least minCount</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="277.4243" x="512" y="636.7075">readings are inside [minValue, maxValue].</text><polygon fill="#000000" points="356.0171,666.9063,346.0171,670.9063,356.0171,674.9063,352.0171,670.9063" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="350.0171" x2="791.5317" y1="670.9063" y2="670.9063"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="348.207" x="394.6709" y="665.8403">POST /signBatch (sessionId, salt, patient, 5 event ids)</text><polygon fill="#000000" points="579.9849,696.0391,589.9849,700.0391,579.9849,704.0391,583.9849,700.0391" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="345.0171" x2="585.9849" y1="700.0391" y2="700.0391"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="107.0215" x="414.9902" y="694.9731">POST /signBatch</text><path d="M425,713.0391 L425,798.0391 L757,798.0391 L757,723.0391 L747,713.0391 L425,713.0391 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M747,713.0391 L747,723.0391 L757,723.0391 L747,713.0391 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="311.6572" x="431" y="730.106">Checks sessionId against the event ids and that</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="261.4536" x="431" y="745.2388">no event was signed in another session.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="272.0669" x="431" y="760.3716">Takes the readings from its own memory,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="293.6426" x="431" y="775.5044">computes Poseidon(sessionId, salt, readings)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="172.6626" x="431" y="790.6372">and signs it with ed25519.</text><polygon fill="#000000" points="356.0171,820.8359,346.0171,824.8359,356.0171,828.8359,352.0171,824.8359" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="350.0171" x2="590.9849" y1="824.8359" y2="824.8359"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="163.814" x="386.594" y="819.77">commitment + signature</text><polygon fill="#000000" points="780.5317,849.9688,790.5317,853.9688,780.5317,857.9688,784.5317,853.9688" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="345.0171" x2="786.5317" y1="853.9688" y2="853.9688"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="163.814" x="486.8674" y="848.9028">commitment + signature</text><path d="M579,866.9688 L579,891.9688 L1005,891.9688 L1005,876.9688 L995,866.9688 L579,866.9688 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M995,866.9688 L995,876.9688 L1005,876.9688 L995,866.9688 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="405.7295" x="585" y="884.0356">Rejects the signature if the commitment differs from its proof.</text><polygon fill="#000000" points="1167.9414,914.2344,1177.9414,918.2344,1167.9414,922.2344,1171.9414,918.2344" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;" x1="792.5317" x2="1173.9414" y1="918.2344" y2="918.2344"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="363.4097" x="804.5317" y="913.1685">claim(patient, sessionId, commitment, signature, proof)</text><path d="M990,931.2344 L990,986.2344 L1369,986.2344 L1369,941.2344 L1359,931.2344 L990,931.2344 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M1359,931.2344 L1359,941.2344 L1369,941.2344 L1359,931.2344 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="254.7759" x="996" y="948.3013">1. Session not paid before (anti-replay)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="233.6445" x="996" y="963.4341">2. Verifier signature (host ed25519)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="358.1919" x="996" y="978.5669">3. Groth16 proof against the stored policy (BLS12-381)</text><line style="stroke:#000000;stroke-width:1.0;" x1="1179.9414" x2="1221.9414" y1="1012.7656" y2="1012.7656"/><line style="stroke:#000000;stroke-width:1.0;" x1="1221.9414" x2="1221.9414" y1="1012.7656" y2="1025.7656"/><line style="stroke:#000000;stroke-width:1.0;" x1="1180.9414" x2="1221.9414" y1="1025.7656" y2="1025.7656"/><polygon fill="#000000" points="1190.9414,1021.7656,1180.9414,1025.7656,1190.9414,1029.7656,1186.9414,1025.7656" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="353.8564" x="1186.9414" y="1007.6997">mark session, transfer USDC to the patient (or carrier)</text><polygon fill="#000000" points="1535.7979,1050.8984,1545.7979,1054.8984,1535.7979,1058.8984,1539.7979,1054.8984" style="stroke:#000000;stroke-width:1.0;"/><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="1179.9414" x2="1541.7979" y1="1054.8984" y2="1054.8984"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="118.4282" x="1304.6555" y="1049.8325">SessionPaid event</text><line style="stroke:#000000;stroke-width:1.0;" x1="1547.7979" x2="1589.7979" y1="1084.0313" y2="1084.0313"/><line style="stroke:#000000;stroke-width:1.0;" x1="1589.7979" x2="1589.7979" y1="1084.0313" y2="1097.0313"/><line style="stroke:#000000;stroke-width:1.0;" x1="1548.7979" x2="1589.7979" y1="1097.0313" y2="1097.0313"/><polygon fill="#000000" points="1558.7979,1093.0313,1548.7979,1097.0313,1558.7979,1101.0313,1554.7979,1097.0313" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="358.2554" x="1554.7979" y="1078.9653">show the payment and its transaction on stellar