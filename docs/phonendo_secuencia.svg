,134.0999 L693,124.0999 L98,124.0999" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M693,124.0999 L693,134.0999 L703,134.0999 L693,124.0999" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="288.0673" x="186.3268" y="142.9969">Dispositivo previamente registrado en Storage.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="419.5493" x="186.3268" y="160.703">Flujo operativo: SSE desde Reader; verificaci&#243;n y guardado por HTTP.</text><g class="message" data-participant-1="M" data-participant-2="R"><polygon fill="#000000" points="148.3729,194.218,138.3729,198.218,148.3729,202.218,144.3729,198.218" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="142.3729" x2="288.969" y1="198.218" y2="198.218"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="128.5961" x="149.3729" y="192.409">Suscribirse a /stream</text></g><g class="message" data-participant-1="R" data-participant-2="M"><polygon fill="#000000" points="277.969,225.924,287.969,229.924,277.969,233.924,281.969,229.924" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="137.3729" x2="283.969" y1="229.924" y2="229.924"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="109.1481" x="159.0969" y="224.115">Observaci&#243;n (SSE)</text></g><path d="M10,242.924 L10,269.924 L417,269.924 L417,252.924 L407,242.924 L10,242.924" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M407,242.924 L407,252.924 L417,252.924 L407,242.924" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="386.3992" x="16" y="261.821">Alternativa: POST /newEvent; tiene prioridad para ese readerId.</