array:2,2;" x1="233.2961" x2="717.2029" y1="467.8661" y2="467.8661"/><text fill="#000000" font-family="Verdana" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="102.7283" x="238.2961" y="479.625">[Rechazo expl&#237;cito]</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg7"><polygon fill="#000000" points="300.969,503.554,290.969,507.554,300.969,511.554,296.969,507.554" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="294.969" x2="569.9532" y1="507.554" y2="507.554"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="50.96" x="404.9811" y="501.745">Rechazo</text></g><path d="M247,520.554 L247,547.554 L705,547.554 L705,530.554 L695,520.554 L247,520.554" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M695,520.554 L695,530.554 L705,530.554 L695,520.554" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="194.7402" x="374.5833" y="539.451">Descartar evento; no guardarlo.</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="233.2961" x2="717.2029" y1="554.26" y2="554.26"/><text fill="#000000" font-family="Verdana" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="53.1186" x="238.2961" y="566.019">[Timeout]</text><path d="M247,575.2419 L247,602.2419 L705,602.2419 L705,585.2419 L695,575.2419 L247,575.2419" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M695,575.2419 L695,585.2419 L705,585.2419 L695,575.2419" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="335.7123" x="304.0972" y="594.1389">Cola en memoria y reintento desde la etapa pendiente.</text><rect fill="#FFFFFF" height="3" style="stroke:#FFFFFF;stroke-width:1;" width="826.4806" x="5" y="636.801"/><line style="stroke:#000000;stroke-width:0.5;" x1="5" x2="831.4806" y1="636.801" y2="636.801"/><line style="stroke:#000000;stroke-width:0.5;" x1="5" x2="831.4806" y1="639.801" y2="639.801"/><rect fill="#FFFFFF" height="25.706" style="stroke:#000000;stroke-width:1;" width="260.0512" x="288.2147" y="624.9479"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="242.6712" x="294.2147" y="642.845">Intercambio SSE opcional con Verifier</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg8"><polygon fill="#000000" points="300.969,680.36,290.969,684.36,300.969,688.36,296.969,684.36" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="294.969" x2="569.9532" y1="684.36" y2="684.36"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="176.6181" x="342.152" y="678.551">Suscribirse a /stream/verifier</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg9"><polygon fill="#000000" points="558.9532,712.066,568.9532,716.066,558.9532,720.066,562.9532,716.066" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="289.969" x2="564.9532" y1="716.066" y2="716.066"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="134.7451" x="363.0885" y="710.257">Evento Captured (SSE)</text></g><path d="M470,729.066 L470,756.066 L670,756.066 L670,739.066 L660,729.066 L470,729.066" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M660,729.066 L660,739.066 L670,739.066 L660,729.066" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="179.5951" x="476" y="747.963">Verificar y firmar si se acepta.</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg10"><polygon fill="#000000" points="300.969,781.478,290.969,785.478,300.969,789.478,296.969,785.478" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="294.969" x2="569.9532" y1="785.478" y2="785.478"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="256.9842" x="301.969" y="779.669">Resultado Verified por /stream del Verifier</text></g><path d="M196,798.478 L196,861.478 L664,861.478 L664,808.478 L654,798.478 L196,798.478" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M654,798.478 L654,808.478 L664,808.478 L654,798.478" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="276.5103" x="202" y="817.375">El Verifier ya publica para varios suscriptores.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="445.8092" x="202" y="835.0811">Manager correlaciona el resultado con su evento y contin&#250;a el guardado.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="447.0444" x="202" y="852.7871">El env&#237;o SSE no espera respuestas ni reintenta por timeout del suscriptor.</text><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg11"><polygon fill="#000000" points="652.527,886.3021,662.527,890.3021,652.527,894.3021,656.527,890.3021" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="289.969" x2="658.527" y1="890.3021" y2="890.3021"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="322.2573" x="316.1194" y="884.4931">Guardar Verified (HTTP o salida SSE /stream/storage)</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg12"><polygon fill="#000000" points="300.969,918.0081,290.969,922.0081,300.969,926.0081,296.969,922.0081" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="294.969" x2="663.527" y1="922.0081" y2="922.0081"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="325.7673" x="314.3644" y="916.1991">Evento guardado por /stream propio (si est&#225; suscrito)</text></g><path d="M247,935.0081 L247,962.0081 L705,962.0081 L705,945.0081 L695,935.0081 L247,935.0081" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M695,935.0081 L695,945.0081 L705,945.0081 L695,935.0081" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="307.1772" x="318.3648" y="953.9051">Recibir la confirmaci&#243;n no provoca otro guardado.</text><rect fill="#FFFFFF" height="3" style="stroke:#FFFFFF;stroke-width:1;" width="826.4806" x="5" y="989.5671"/><line style="stroke:#000000;stroke-width:0.5;" x1="5" x2="831.4806" y1="989.5671" y2="989.5671"/><line style="stroke:#000000;stroke-width:0.5;" x1="5" x2="831.4806" y1="992.5671" y2="992.5671"/><rect fill="#FFFFFF" height="25.706" style="stroke:#000000;stroke-width:1;" width="136.9021" x="349.7893" y="977.7141"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119.522" x="355.7893" y="995.6111">Publicaci&#243;n futura</text><g class="message" data-entity-1="part2" data-entity-2="part5" id="msg13"><polygon fill="#000000" points="759.8418,1033.1262,769.8418,1037.1262,759.8418,1041.1262,763.8418,1037.1262" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="289.969" x2="765.8418" y1="1037.1262" y2="1037.1262"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="231.2832" x="415.2638" y="1031.3172">Publicar evento verificado (pendiente)</text></g><?plantuml-src RLIzRXiv4Exv57D9Om6E3AICuG268bzS216qXgeq57TaCSSb6PAhH5VTG-G5yW2fhakhDxadkHboTxthf5li36Vc-vdv8nsmGV16QYiEkaROEvT